name: Auto Build Lampa APK

on:
  schedule:
    # 每天 UTC 02:37（北京时间 10:37）避开整点高峰自动检测
    - cron: '37 2 * * *'
  workflow_dispatch: # 支持网页手动点击立即触发

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    environment: lampa # 指定使用你的 lampa 密钥环境

    steps:
      # 1. 检出当前仓库
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # 2. 监测上游 yumata/lampa 仓库是否有新 Commit (git ls-remote 永不限流)
      - name: Check Upstream Changes
        id: check_upstream
        run: |
          LATEST_SHA=$(git ls-remote https://github.com/yumata/lampa.git HEAD | awk '{print $1}')
          echo "Upstream latest commit: $LATEST_SHA"

          LAST_SHA=""
          if [ -f .last_commit ]; then
            LAST_SHA=$(cat .last_commit)
          fi
          echo "Previous recorded commit: $LAST_SHA"

          if [ "$LATEST_SHA" == "$LAST_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Upstream has not changed. Skipping build."
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          fi

      # 3. 拉取最新 lampa 源码到临时目录 upstream_code
      - name: Clone Upstream Lampa Code
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          git clone --depth 1 https://github.com/yumata/lampa.git upstream_code

      # 4. 执行 Python 脚本完成注入与方法替换（传入 NTFY_TOPIC、仓库名与构建号）
      - name: Patch Lampa Code
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPO_NAME: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 scripts/patch.py

      # 5. 配置构建环境 (Node 18 + Java 11 + Gradle 7.4.2 + Android SDK)
      - name: Setup Node.js
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 11 JDK
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 安装适配 Java 11 的 Gradle 7.4.2
      - name: Setup Gradle 7.4.2 for Java 11
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          sudo unzip -q -d /opt gradle-7.4.2-bin.zip
          echo "/opt/gradle-7.4.2/bin" >> $GITHUB_PATH

      # 借用环境自带的 Java 17 运行 sdkmanager 精准安装 30.0.3
      - name: Setup Android SDK Environment
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME_17_X64/bin:$PATH

          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platforms;android-30" "platforms;android-29"

      # 6. 初始化 Cordova 工程、安装插件、生成包含子版本号的版本名并打包 Release APK
      - name: Setup Cordova & Build Signed Release APK
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '197346' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ASTON' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '197346' }}
        run: |
          npm install -g cordova

          cordova create lampa_app org.aston.lampa Lampa
          cd lampa_app

          if [ -f "../config.xml" ]; then
            cp ../config.xml config.xml
            echo "Successfully loaded custom config.xml from repository root."
          fi

          # ========== 自动提取主版本并拼接子版本号（如 3.3.3.38） ==========
          RAW_VERSION=$(sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p' config.xml | head -n 1)
          if [ -z "$RAW_VERSION" ]; then RAW_VERSION="3.3.3"; fi
          # 提取主版本前三位（例如 3.3.3）
          BASE_VERSION=$(echo "$RAW_VERSION" | awk -F. '{print $1"."$2"."$3}')
          
          VERSION_CODE="${{ github.run_number }}"
          # 规范生成带子版本的完整版本名：3.3.3.38
          FULL_VERSION="${BASE_VERSION}.${VERSION_CODE}"

          # 注入带子版本号的完整版本名到 config.xml
          sed -i "s/version=\"[^\"]*\"/version=\"$FULL_VERSION\" android-versionCode=\"$VERSION_CODE\"/g" config.xml

          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Synchronized version name: $FULL_VERSION (versionCode: $VERSION_CODE)"
          # ===============================================================

          rm -rf www/*
          cp -r ../upstream_code/* www/

          if [ -d "../res" ]; then
            mkdir -p res
            cp -r ../res/* res/ || true
          fi

          # 安装 7 个核心插件
          cordova plugin add com-darryncampbell-cordova-plugin-intent@2.2.0
          cordova plugin add https://github.com/aporat/cordova-plugin-fetch.git
          cordova plugin add cordova-plugin-file@7.0.0
          cordova plugin add cordova-plugin-http@1.2.0
          cordova plugin add cordova-plugin-splashscreen@6.0.2
          cordova plugin add cordova-plugin-inappbrowser@5.0.0
          cordova plugin add cordova-plugin-statusbar@3.0.0
          cordova plugin add cordova-plugin-androidx-adapter || true

          cordova platform add android@10.1.2

          echo "$KEYSTORE_BASE64" | base64 --decode > aston.keystore

          cat <<EOF > build.json
          {
            "android": {
              "debug": {
                "keystore": "aston.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": "jks"
              },
              "release": {
                "keystore": "aston.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": "jks"
              }
            }
          }
          EOF

          # 构建已签名的 Release APK
          cordova build android --release --buildConfig=build.json -- --packageType=apk

          # 精简重命名生成的 APK：lampa-v3.3.3.38.apk
          mv platforms/android/app/build/outputs/apk/release/app-release.apk platforms/android/app/build/outputs/apk/release/lampa-v${FULL_VERSION}.apk

      # 7. 上传到 Actions Artifacts
      - name: Upload Artifact
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lampa-v${{ env.FULL_VERSION }}
          path: lampa_app/platforms/android/app/build/outputs/apk/release/*.apk

      # 8. 自动发布到 GitHub Releases（直链下载）
      - name: Create GitHub Release
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VERSION }}
          name: Lampa v${{ env.FULL_VERSION }}
          body: |
            ### Lampa 自动构建完成
            - **应用包名**：`org.aston.lampa`
            - **版本名 (versionName)**：`v${{ env.FULL_VERSION }}`
            - **构建编号 (versionCode)**：`${{ env.VERSION_CODE }}`
            - **上游 Commit**：[${{ steps.check_upstream.outputs.latest_sha }}](https://github.com/yumata/lampa/commit/${{ steps.check_upstream.outputs.latest_sha }})
            - **状态**：已签名 Release 正式版，支持在线覆盖升级。
          files: |
            lampa_app/platforms/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 自动生成规范的 version.json 并更新 README.md
      - name: Generate version.json & Update README
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          FULL_VERSION: ${{ env.FULL_VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
          UPSTREAM_SHA: ${{ steps.check_upstream.outputs.latest_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import os, re, json, urllib.request
          from datetime import datetime, timezone, timedelta

          repo = os.environ['REPO']
          run_num = int(os.environ['RUN_NUMBER'])
          full_ver = os.environ['FULL_VERSION']
          version_tag = f\"v{full_ver}\"
          sha = os.environ['UPSTREAM_SHA']
          short_sha = sha[:7] if sha and sha != 'null' else 'unknown'
          apk_name = f\"lampa-v{full_ver}.apk\"
          
          # 1. 官方直链与加速镜像
          direct_url = f\"https://github.com/{repo}/releases/download/{version_tag}/{apk_name}\"
          mirror_url = f\"https://ghfast.top/{direct_url}\"
          build_date = os.popen(\"TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M (UTC+8)'\").read().strip()

          # --- 生成供电视端精准比对的规范 version.json ---
          ver_data = {
              'version': version_tag,
              'versionName': full_ver,
              'versionCode': run_num,
              'apk_name': apk_name,
              'direct_url': direct_url,
              'mirror_url': mirror_url,
              'build_date': build_date,
              'upstream_sha': short_sha
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(ver_data, f, indent=2, ensure_ascii=False)
          print('[Success] 成功生成包含子版本的规范 version.json！')

          # --- 更新 README.md 本地构建信息 ---
          my_block = '\n'.join([
              '<!-- LATEST_BUILD_INFO_START -->',
              '### 🚀 Latest Automated Build',
              f'- **App Version**: \`{version_tag}\`',
              f'- **Build Date**: \`{build_date}\`',
              f'- **Upstream Source**: [{short_sha}](https://github.com/yumata/lampa/commit/{sha})',
              f'- **Direct Download**: [📦 {apk_name}]({direct_url})',
              '<!-- LATEST_BUILD_INFO_END -->'
          ])

          # 9. 自动生成规范的 version.json 并更新 README.md（改用 EOF 彻底解决引号语法冲突）
      - name: Generate version.json & Update README
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          FULL_VERSION: ${{ env.FULL_VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
          UPSTREAM_SHA: ${{ steps.check_upstream.outputs.latest_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, re, json, urllib.request
          from datetime import datetime, timezone, timedelta

          repo = os.environ['REPO']
          run_num = int(os.environ['RUN_NUMBER'])
          full_ver = os.environ['FULL_VERSION']
          version_tag = f"v{full_ver}"
          sha = os.environ['UPSTREAM_SHA']
          short_sha = sha[:7] if sha and sha != 'null' else 'unknown'
          apk_name = f"lampa-v{full_ver}.apk"
          
          # 1. 官方直链与加速镜像
          direct_url = f"https://github.com/{repo}/releases/download/{version_tag}/{apk_name}"
          mirror_url = f"https://ghfast.top/{direct_url}"
          build_date = os.popen("TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M (UTC+8)'").read().strip()

          # --- 生成供电视端精准比对的规范 version.json ---
          ver_data = {
              'version': version_tag,
              'versionName': full_ver,
              'versionCode': run_num,
              'apk_name': apk_name,
              'direct_url': direct_url,
              'mirror_url': mirror_url,
              'build_date': build_date,
              'upstream_sha': short_sha
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(ver_data, f, indent=2, ensure_ascii=False)
          print('[Success] 成功生成包含子版本的规范 version.json！')

          # --- 更新 README.md 本地构建信息 ---
          my_block = '\n'.join([
              '<!-- LATEST_BUILD_INFO_START -->',
              '### 🚀 Latest Automated Build',
              f'- **App Version**: `{version_tag}`',
              f'- **Build Date**: `{build_date}`',
              f'- **Upstream Source**: [{short_sha}](https://github.com/yumata/lampa/commit/{sha})',
              f'- **Direct Download**: [📦 {apk_name}]({direct_url})',
              '<!-- LATEST_BUILD_INFO_END -->'
          ])

          # --- 抓取并追踪你指定的目标仓库列表 ---
          RELATED_REPOS = [
              'lampa-app/LAMPA',
              'yourok/torrserver'
          ]
          tz_cst = timezone(timedelta(hours=8))
          related_sections = [
              '<!-- RELATED_RELEASES_START -->',
              '### 🌐 Related Lampa Community Builds'
          ]

          for target in RELATED_REPOS:
              api_url = f'https://api.github.com/repos/{target}/releases/latest'
              req = urllib.request.Request(api_url)
              gh_token = os.environ.get('GH_TOKEN', '')
              if gh_token:
                  req.add_header('Authorization', f'Bearer {gh_token}')
              req.add_header('User-Agent', 'GitHub-Actions-Script')
              req.add_header('Accept', 'application/vnd.github.v3+json')
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.loads(response.read().decode('utf-8'))
                      tag = data.get('tag_name', 'unknown')
                      rel_name = data.get('name') or tag
                      html_url = data.get('html_url', f'https://github.com/{target}/releases')
                      pub_at = data.get('published_at', '')
                      date_str = datetime.fromisoformat(pub_at.replace('Z', '+00:00')).astimezone(tz_cst).strftime('%Y-%m-%d %H:%M (UTC+8)') if pub_at else 'N/A'
                      apk_links = [f"[📦 {a['name']}]({a['browser_download_url']})" for a in data.get('assets', []) if a.get('name', '').endswith('.apk')]
                      download_text = ' / '.join(apk_links) if apk_links else f'[View Assets]({html_url})'

                      related_sections.append(f'\n#### 📦 [{target}](https://github.com/{target})')
                      related_sections.append(f'- **App Version**: `{tag}` ({rel_name})')
                      related_sections.append(f'- **Release Date**: `{date_str}`')
                      related_sections.append(f'- **Release Notes**: [View Details]({html_url})')
                      related_sections.append(f'- **Direct Download**: {download_text}')
                      print(f'[Success] 已抓取 {target} 最新 Release: {tag}')
              except Exception as e:
                  print(f'[Warning] 抓取 {target} 失败: {e}')

          related_sections.append('<!-- RELATED_RELEASES_END -->')
          related_block = '\n'.join(related_sections)

          if os.path.exists('README.md'):
              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              if re.search(r'<!-- LATEST_BUILD_INFO_START -->[\s\S]*?<!-- LATEST_BUILD_INFO_END -->', content):
                  content = re.sub(r'<!-- LATEST_BUILD_INFO_START -->[\s\S]*?<!-- LATEST_BUILD_INFO_END -->', my_block, content)
              if re.search(r'<!-- RELATED_RELEASES_START -->[\s\S]*?<!-- RELATED_RELEASES_END -->', content):
                  content = re.sub(r'<!-- RELATED_RELEASES_START -->[\s\S]*?<!-- RELATED_RELEASES_END -->', related_block, content)
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(content)
              print('[Success] README.md 与 version.json 准备就绪！')
          EOF

      # 10. 保证将 .last_commit、README.md 与 version.json 自动推回仓库
      - name: Push Updates to Repository
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          echo "${{ steps.check_upstream.outputs.latest_sha }}" > .last_commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_commit README.md version.json
          git commit -m "chore: auto sync, update version.json & README [skip ci]" || true
          git push

      # 11. 自动清理旧 Release，永远只保留最新的 3 个版本
      - name: Cleanup Old Releases
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
