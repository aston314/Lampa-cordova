name: Auto Build Lampa APK

on:
  schedule:
    # 每天 UTC 02:37（北京时间 10:37）避开整点高峰自动检测
    - cron: '37 2 * * *'
  workflow_dispatch: # 支持网页手动点击立即触发

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    environment: lampa # 指定使用你的 lampa 密钥环境

    steps:
      # 1. 检出当前仓库
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # 2. 监测上游 yumata/lampa 仓库是否有新 Commit (git ls-remote 永不限流)
      - name: Check Upstream Changes
        id: check_upstream
        run: |
          LATEST_SHA=$(git ls-remote https://github.com/yumata/lampa.git HEAD | awk '{print $1}')
          echo "Upstream latest commit: $LATEST_SHA"

          LAST_SHA=""
          if [ -f .last_commit ]; then
            LAST_SHA=$(cat .last_commit)
          fi
          echo "Previous recorded commit: $LAST_SHA"

          if [ "$LATEST_SHA" == "$LAST_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Upstream has not changed. Skipping build."
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          fi

      # 3. 拉取最新 lampa 源码到临时目录 upstream_code
      - name: Clone Upstream Lampa Code
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          git clone --depth 1 https://github.com/yumata/lampa.git upstream_code

      # 4. 执行 Python 脚本完成注入与方法替换（传入 NTFY_TOPIC）
      - name: Patch Lampa Code
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 scripts/patch.py

      # 5. 配置构建环境 (Node 18 + Java 11 + Gradle 7.4.2 + Android SDK)
      - name: Setup Node.js
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 11 JDK
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 安装适配 Java 11 的 Gradle 7.4.2
      - name: Setup Gradle 7.4.2 for Java 11
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          sudo unzip -q -d /opt gradle-7.4.2-bin.zip
          echo "/opt/gradle-7.4.2/bin" >> $GITHUB_PATH

      # 借用环境自带的 Java 17 运行 sdkmanager 精准安装 30.0.3
      - name: Setup Android SDK Environment
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME_17_X64/bin:$PATH

          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platforms;android-30" "platforms;android-29"

      # 6. 初始化 Cordova 工程、安装插件、还原证书并打包 Release APK
      - name: Setup Cordova & Build Signed Release APK
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '197346' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ASTON' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '197346' }}
        run: |
          npm install -g cordova

          cordova create lampa_app org.aston.lampa Lampa
          cd lampa_app

          if [ -f "../config.xml" ]; then
            cp ../config.xml config.xml
            echo "Successfully loaded custom config.xml from repository root."
          fi

          # ========== 自动同步 config.xml 版本号与 versionCode ==========
          APP_VERSION=$(sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p' config.xml | head -n 1)
          if [ -z "$APP_VERSION" ]; then APP_VERSION="3.3.3"; fi

          VERSION_CODE="${{ github.run_number }}"

          if grep -q "android-versionCode=" config.xml; then
            sed -i "s/android-versionCode=\"[^\"]*\"/android-versionCode=\"$VERSION_CODE\"/g" config.xml
          else
            sed -i "s/<widget /<widget android-versionCode=\"$VERSION_CODE\" /g" config.xml
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Synchronized version: $APP_VERSION (versionCode: $VERSION_CODE)"
          # ===============================================================

          rm -rf www/*
          cp -r ../upstream_code/* www/

          if [ -d "../res" ]; then
            mkdir -p res
            cp -r ../res/* res/ || true
          fi

          # 安装 7 个核心插件
          cordova plugin add com-darryncampbell-cordova-plugin-intent@2.2.0
          cordova plugin add https://github.com/aporat/cordova-plugin-fetch.git
          cordova plugin add cordova-plugin-file@7.0.0
          cordova plugin add cordova-plugin-http@1.2.0
          cordova plugin add cordova-plugin-splashscreen@6.0.2
          cordova plugin add cordova-plugin-inappbrowser@5.0.0
          cordova plugin add cordova-plugin-statusbar@3.0.0
          cordova plugin add cordova-plugin-androidx-adapter || true

          cordova platform add android@10.1.2

          echo "$KEYSTORE_BASE64" | base64 --decode > aston.keystore

          cat <<EOF > build.json
          {
            "android": {
              "debug": {
                "keystore": "aston.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": "jks"
              },
              "release": {
                "keystore": "aston.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": "jks"
              }
            }
          }
          EOF

          # 构建已签名的 Release APK
          cordova build android --release --buildConfig=build.json -- --packageType=apk

          # 精简重命名生成的 APK：lampa-v3.3.3-b8.apk
          mv platforms/android/app/build/outputs/apk/release/app-release.apk platforms/android/app/build/outputs/apk/release/lampa-v${APP_VERSION}-b${{ github.run_number }}.apk

      # 7. 上传到 Actions Artifacts
      - name: Upload Artifact
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lampa-v${{ env.APP_VERSION }}-b${{ github.run_number }}
          path: lampa_app/platforms/android/app/build/outputs/apk/release/*.apk

      # 8. 自动发布到 GitHub Releases（直链下载）
      - name: Create GitHub Release
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: Lampa v${{ env.APP_VERSION }} (Build ${{ github.run_number }})
          body: |
            ### Lampa 自动构建完成
            - **应用包名**：`org.aston.lampa`
            - **应用版本**：`v${{ env.APP_VERSION }}`
            - **构建编号**：`Build ${{ github.run_number }}` (versionCode: `${{ github.run_number }}`)
            - **上游 Commit**：[${{ steps.check_upstream.outputs.latest_sha }}](https://github.com/yumata/lampa/commit/${{ steps.check_upstream.outputs.latest_sha }})
            - **状态**：已签名 Release 正式版，支持覆盖安装升级。
          files: |
            lampa_app/platforms/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 自动将自身构建信息 + 其他相关仓库的 Release 汇总更新至 README.md
      - name: Update README with Latest Build Info
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
          UPSTREAM_SHA: ${{ steps.check_upstream.outputs.latest_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import os, re, json, urllib.request
          from datetime import datetime, timezone, timedelta

          # ================= 1. 更新本仓库构建信息 =================
          version = f\"v{os.environ['APP_VERSION']} (Build {os.environ['RUN_NUMBER']})\"
          sha = os.environ['UPSTREAM_SHA']
          short_sha = sha[:7] if sha and sha != 'null' else 'unknown'
          repo = os.environ['REPO']
          apk_name = f\"lampa-v{os.environ['APP_VERSION']}-b{os.environ['RUN_NUMBER']}.apk\"
          download_url = f\"https://github.com/{repo}/releases/download/v{os.environ['APP_VERSION']}-b{os.environ['RUN_NUMBER']}/{apk_name}\"
          build_date = os.popen(\"TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M (UTC+8)'\").read().strip()

          my_block = '\n'.join([
              '<!-- LATEST_BUILD_INFO_START -->',
              '### 🚀 Latest Automated Build',
              f'- **App Version**: \`{version}\`',
              f'- **Build Date**: \`{build_date}\`',
              f'- **Upstream Source**: [{short_sha}](https://github.com/yumata/lampa/commit/{sha})',
              f'- **Direct Download**: [📦 {apk_name}]({download_url})',
              '<!-- LATEST_BUILD_INFO_END -->'
          ])

          # ================= 2. 抓取其他相关仓库的 Release 信息 =================
          # 在这里配置你想汇总的其他 Lampa 仓库列表（owner/repo 格式）
          RELATED_REPOS = [
              'lampa-app/LAMPA',
              # 如果有其他仓库，直接在此追加，例如：'other-user/lampa-client',
          ]

          tz_cst = timezone(timedelta(hours=8))
          related_sections = [
              '<!-- RELATED_RELEASES_START -->',
              '### 🌐 Related Lampa Community Builds'
          ]

          for target in RELATED_REPOS:
              api_url = f'https://api.github.com/repos/{target}/releases/latest'
              req = urllib.request.Request(api_url)
              req.add_header('Authorization', f'Bearer {os.environ[\"GH_TOKEN\"]}')
              req.add_header('User-Agent', 'GitHub-Actions-Script')
              req.add_header('Accept', 'application/vnd.github.v3+json')

              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.loads(response.read().decode('utf-8'))
                      tag = data.get('tag_name', 'unknown')
                      rel_name = data.get('name') or tag
                      html_url = data.get('html_url', f'https://github.com/{target}/releases')
                      
                      # 格式化发布时间为北京时间 (UTC+8)
                      pub_at = data.get('published_at', '')
                      if pub_at:
                          dt = datetime.fromisoformat(pub_at.replace('Z', '+00:00')).astimezone(tz_cst)
                          date_str = dt.strftime('%Y-%m-%d %H:%M (UTC+8)')
                      else:
                          date_str = 'N/A'

                      # 寻找 .apk 附件
                      apk_links = []
                      for asset in data.get('assets', []):
                          name = asset.get('name', '')
                          if name.endswith('.apk'):
                              dl_url = asset.get('browser_download_url', '')
                              apk_links.append(f'[📦 {name}]({dl_url})')

                      download_text = ' / '.join(apk_links) if apk_links else f'[View Assets]({html_url})'

                      related_sections.append(f'\n#### 📦 [{target}](https://github.com/{target})')
                      related_sections.append(f'- **App Version**: \`{tag}\` ({rel_name})')
                      related_sections.append(f'- **Release Date**: \`{date_str}\`')
                      related_sections.append(f'- **Release Notes**: [View Details]({html_url})')
                      related_sections.append(f'- **Direct Download**: {download_text}')
                      print(f'[Success] 已获取相关仓库信息: {target} ({tag})')
              except Exception as e:
                  print(f'[Warning] 抓取 {target} 失败 (可能无 Release 或网络错误): {e}')

          related_sections.append('<!-- RELATED_RELEASES_END -->')
          related_block = '\n'.join(related_sections)

          # ================= 3. 写入 README.md =================
          if os.path.exists('README.md'):
              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()

              # 替换本仓库信息
              my_pattern = r'<!-- LATEST_BUILD_INFO_START -->[\s\S]*?<!-- LATEST_BUILD_INFO_END -->'
              if re.search(my_pattern, content):
                  content = re.sub(my_pattern, my_block, content)

              # 替换其他仓库聚合信息
              rel_pattern = r'<!-- RELATED_RELEASES_START -->[\s\S]*?<!-- RELATED_RELEASES_END -->'
              if re.search(rel_pattern, content):
                  content = re.sub(rel_pattern, related_block, content)

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(content)
              print('[Success] README.md 自身构建与相关仓库聚合信息已全部更新！')
          "

      # 10. 一并提交 .last_commit 与 README.md 推回仓库
      - name: Update Last Commit Record & README
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          echo "${{ steps.check_upstream.outputs.latest_sha }}" > .last_commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_commit README.md
          git commit -m "chore: sync upstream & update build info in README [skip ci]" || true
          git push

      # 11. 自动清理旧 Release，永远只保留最新的 3 个版本
      - name: Cleanup Old Releases
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
