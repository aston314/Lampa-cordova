name: Auto Build Lampa APK

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动检测一次上游仓库
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮立即触发

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    environment: lampa # 指定使用你的 lampa 密钥环境

    steps:
      # 1. 检出当前仓库
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # 2. 监测上游 yumata/lampa 仓库是否有新 Commit (改用 git ls-remote 永不限流)
      - name: Check Upstream Changes
        id: check_upstream
        run: |
          LATEST_SHA=$(git ls-remote https://github.com/yumata/lampa.git HEAD | awk '{print $1}')
          echo "Upstream latest commit: $LATEST_SHA"

          LAST_SHA=""
          if [ -f .last_commit ]; then
            LAST_SHA=$(cat .last_commit)
          fi
          echo "Previous recorded commit: $LAST_SHA"

          if [ "$LATEST_SHA" == "$LAST_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Upstream has not changed. Skipping build."
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          fi

      # 3. 拉取最新 lampa 源码到临时目录 upstream_code
      - name: Clone Upstream Lampa Code
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          git clone --depth 1 https://github.com/yumata/lampa.git upstream_code

      # 4. 执行 Python 脚本完成注入与方法替换（传入 NTFY_TOPIC）
      - name: Patch Lampa Code
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 scripts/patch.py

      # 5. 配置构建环境 (Node 18 + Java 11 + Gradle 7.4.2 + Android SDK)
      - name: Setup Node.js
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 11 JDK
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 安装适配 Java 11 的 Gradle 7.4.2
      - name: Setup Gradle 7.4.2 for Java 11
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          sudo unzip -q -d /opt gradle-7.4.2-bin.zip
          echo "/opt/gradle-7.4.2/bin" >> $GITHUB_PATH

      # 借用环境自带的 Java 17 运行 sdkmanager 精准安装 30.0.3
      - name: Setup Android SDK Environment
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME_17_X64/bin:$PATH

          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platforms;android-30" "platforms;android-29"

      # 6. 初始化 Cordova 工程、安装插件、还原证书并打包 Release APK
      - name: Setup Cordova & Build Signed Release APK
        if: steps.check_upstream.outputs.should_run == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npm install -g cordova

          cordova create lampa_app org.aston.lampa Lampa
          cd lampa_app

          if [ -f "../config.xml" ]; then
            cp ../config.xml config.xml
            echo "Successfully loaded custom config.xml from repository root."
          fi

          # ========== 自动同步 config.xml 版本号与 versionCode ==========
          APP_VERSION=$(sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p' config.xml | head -n 1)
          if [ -z "$APP_VERSION" ]; then APP_VERSION="1.3.3"; fi

          VERSION_CODE="${{ github.run_number }}"

          if grep -q "android-versionCode=" config.xml; then
            sed -i "s/android-versionCode=\"[^\"]*\"/android-versionCode=\"$VERSION_CODE\"/g" config.xml
          else
            sed -i "s/<widget /<widget android-versionCode=\"$VERSION_CODE\" /g" config.xml
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Synchronized version: $APP_VERSION (versionCode: $VERSION_CODE)"
          # ===============================================================

          rm -rf www/*
          cp -r ../upstream_code/* www/

          if [ -d "../res" ]; then
            mkdir -p res
            cp -r ../res/* res/ || true
          fi

          # 安装 7 个核心插件
          cordova plugin add com-darryncampbell-cordova-plugin-intent@2.2.0
          cordova plugin add https://github.com/aporat/cordova-plugin-fetch.git
          cordova plugin add cordova-plugin-file@7.0.0
          cordova plugin add cordova-plugin-http@1.2.0
          cordova plugin add cordova-plugin-splashscreen@6.0.2
          cordova plugin add cordova-plugin-inappbrowser@5.0.0
          cordova plugin add cordova-plugin-statusbar@3.0.0
          cordova plugin add cordova-plugin-androidx-adapter || true


          cordova platform add android@10.1.2

          echo "$KEYSTORE_BASE64" | base64 --decode > aston.keystore

          cat <<EOF > build.json
          {
            "android": {
              "debug": {
                "keystore": "aston.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": "jks"
              },
              "release": {
                "keystore": "aston.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": "jks"
              }
            }
          }
          EOF

          # 构建已签名的 Release APK
          cordova build android --release --buildConfig=build.json -- --packageType=apk

          # 精简重命名生成的 APK：lampa-v3.3.3-b8.apk
          mv platforms/android/app/build/outputs/apk/release/app-release.apk platforms/android/app/build/outputs/apk/release/lampa-v${APP_VERSION}-b${{ github.run_number }}.apk

      # 7. 上传到 Actions Artifacts
      - name: Upload Artifact
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lampa-v${{ env.APP_VERSION }}-b${{ github.run_number }}
          path: lampa_app/platforms/android/app/build/outputs/apk/release/*.apk

      # 8. 自动发布到 GitHub Releases（直链下载）
      - name: Create GitHub Release
        if: steps.check_upstream.outputs.should_run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: Lampa v${{ env.APP_VERSION }} (Build ${{ github.run_number }})
          body: |
            ### Lampa 自动构建完成
            - **应用包名**：`org.aston.lampa`
            - **应用版本**：`v${{ env.APP_VERSION }}`
            - **构建编号**：`Build ${{ github.run_number }}` (versionCode: `${{ github.run_number }}`)
            - **上游 Commit**：[${{ steps.check_upstream.outputs.latest_sha }}](https://github.com/yumata/lampa/commit/${{ steps.check_upstream.outputs.latest_sha }})
            - **状态**：已签名 Release 正式版，支持覆盖安装升级。
          files: |
            lampa_app/platforms/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 记录最新的 Commit Hash
      - name: Update Last Commit Record
        if: steps.check_upstream.outputs.should_run == 'true'
        run: |
          echo "${{ steps.check_upstream.outputs.latest_sha }}" > .last_commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_commit
          git commit -m "chore: sync upstream to v${{ env.APP_VERSION }}-b${{ github.run_number }} [skip ci]" || true
          git push
